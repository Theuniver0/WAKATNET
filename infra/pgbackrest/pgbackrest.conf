# WAKATNET — modèle de configuration pgBackRest (ADR 0015 §5). Installé en /etc/pgbackrest/pgbackrest.conf
# sur LES DEUX nœuds (la sauvegarde suit le primaire après une bascule). AUCUN secret ici :
# repo1-cipher-pass, repo1-s3-key et repo1-s3-key-secret vont dans /etc/pgbackrest/conf.d/secret.conf
# (propriétaire postgres, mode 0600), créé à la main par Yacouba. Une copie de la phrase de passe HORS
# des nœuds est obligatoire : sans elle, la sauvegarde est perdue avec eux.
[global]
# Dépôt compatible S3 chez un TROISIÈME fournisseur, distinct des hébergeurs des nœuds : [À CONFIRMER].
repo1-type=s3
repo1-s3-endpoint=A_CONFIRMER.example
repo1-s3-bucket=wakatnet-sauvegardes
repo1-s3-region=A_CONFIRMER
repo1-path=/wakatnet
# Chiffrement côté client : le fournisseur ne voit que des blocs chiffrés.
repo1-cipher-type=aes-256-cbc
# 4 sauvegardes complètes (une par semaine) ; les WAL nécessaires à chacune sont gardés.
repo1-retention-full=4
compress-type=zst
start-fast=y
# Un seul processus : la sauvegarde tourne la nuit, sur le primaire, sans gêner l'authentification.
process-max=1
log-level-console=warn
log-level-file=info

[wakatnet]
pg1-path=/var/lib/postgresql/16/main
