# WAKATNET — rôles appliqués sur les nœuds d'essai (essais/essai.sh). Sous-ensemble du site.yml :
# wireguard (module du noyau), parefeu (éprouvé à part, étape 9), freeradius (garde de version, éprouvée à part) et noeud_wakatnet (Node
# téléchargé depuis nodejs.org) ne s'appliquent pas dans ces conteneurs.
- name: Nœuds d'essai
  hosts: noeuds
  become: true
  serial: 1
  roles:
    - socle
    - postgresql
    - pgbackrest
    - frontal
