# Pare-feu de l'interface publique (ADR 0016 §3, revue de sécurité F5), avec retour arrière programmé
# AVANT le chargement : une erreur (port SSH) se corrige seule en 5 minutes, en mémoire et sur disque.
- name: Rendu et chargement de la table
  ansible.builtin.include_tasks: charger.yml

- name: Vérification par une connexion neuve, puis annulation  # noqa: no-handler
  when: parefeu_a_appliquer | bool
  block:
    - name: Connexion neuve au nœud
      ansible.builtin.meta: reset_connection
    - name: Le nœud répond par une connexion neuve
      ansible.builtin.ping:
    - name: Annuler le retour arrière
      ansible.builtin.systemd_service:
        name: wakatnet-parefeu-retour.timer
        state: stopped
    - name: Sauvegarde du fichier précédent effacée (la nouvelle table est validée)
      when: parefeu_sauvegarde | length > 0
      ansible.builtin.file:
        path: "{{ parefeu_sauvegarde }}"
        state: absent
