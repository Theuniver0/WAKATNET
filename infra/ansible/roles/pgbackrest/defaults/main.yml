# Stockage S3 hors site : Backblaze B2, région EU Central, bucket verrouillé en mode conformité (ADR 0018).
# À recopier de la console B2 à la création du bucket (le nom est unique chez B2 : le suffixer).
pgbackrest_s3_endpoint: "s3.eu-central-003.backblazeb2.com"
pgbackrest_s3_bucket: wakatnet-sauvegardes
pgbackrest_s3_region: "eu-central-003"
# --repo-target-time sur S3 au-delà de 1 000 versions : corrigé en 2.59.2 (pgBackRest #2854, ADR 0018 §7).
pgbackrest_version_min: "2.59.2"
