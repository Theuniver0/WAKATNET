# Noms publics (ADR 0016 §2). [À CONFIRMER] : le domaine de la plateforme (ADR 0004, questions ouvertes).
frontal_nom_api: "api.A_CONFIRMER.example"
frontal_nom_portail: "portail.A_CONFIRMER.example"
# Mode TLS, PAR NŒUD dans l'inventaire (ADR 0016 §2, audit du 13/11/2026) :
#   letsencrypt : certbot (défi http-01) ; seulement sur le nœud vers lequel pointe le DNS (A, ou B après une
#                 bascule). Ailleurs, le défi échoue et le passage s'arrête.
#   autosigne   : certificat auto-signé local, en attendant la bascule (réplique). Valeur par défaut : un nœud
#                 neuf ne lance jamais certbot sans qu'on l'ait demandé.
#   fourni      : certificat posé à la main aux chemins frontal_certificat et frontal_cle.
frontal_tls: autosigne
frontal_certificat: "/etc/letsencrypt/live/wakatnet/fullchain.pem"
frontal_cle: "/etc/letsencrypt/live/wakatnet/privkey.pem"
frontal_courriel_acme: ""
# Écoute IPv6 : vraie sur un nœud qui a une adresse IPv6 (Hetzner en fournit une) ; fausse sinon (nginx refuse
# de démarrer sur une famille d'adresses absente).
frontal_ipv6: true
frontal_journal_acces: /var/log/nginx/access.log
