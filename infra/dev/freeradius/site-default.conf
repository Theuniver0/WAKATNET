# WAKATNET — site « default » de DÉVELOPPEMENT (phase 0), monté en lecture
# seule sur /etc/freeradius/sites-available/default par infra/docker-compose.yml.
#
# Pourquoi remplacer le site de l'image : il écoute aussi en IPv6 (::), et
# FreeRADIUS refuse de démarrer sur un hôte sans IPv6 (constaté le 10/11/2026 :
# « Failed opening auth address :: port 1812 … Address family not supported
# by protocol »). Le hotspot MikroTik n'est fiable qu'en IPv4 (SPEC §1.1).
#
# Ce site est volontairement réduit à ce que le hotspot emploie (PAP, CHAP ;
# pas de MS-CHAP ni d'EAP, SPEC §1.1). Aucune décision d'accès ici : elle
# vivra dans les fonctions SQL du schéma radius (phase 1, infra/freeradius/
# et infra/sql/radius/). Sans utilisateur déclaré, toute requête est rejetée.

server default {
	listen {
		type = auth
		ipaddr = *
		port = 1812
	}

	listen {
		type = acct
		ipaddr = *
		port = 1813
	}

	authorize {
		filter_username
		preprocess
		chap
		files
		pap
	}

	authenticate {
		Auth-Type PAP {
			pap
		}
		Auth-Type CHAP {
			chap
		}
	}

	preacct {
		preprocess
		acct_unique
	}

	# Accounting écrit dans un fichier detail (SPEC §4, règle 2).
	accounting {
		detail
		attr_filter.accounting_response
	}

	post-auth {
		Post-Auth-Type REJECT {
			attr_filter.access_reject
		}
	}
}
