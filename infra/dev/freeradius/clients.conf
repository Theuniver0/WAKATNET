# WAKATNET — clients.conf de DÉVELOPPEMENT (phase 0), monté en lecture seule
# sur /etc/freeradius/clients.conf par infra/docker-compose.yml.
#
# Remplace le clients.conf de l'image (et son secret par défaut « testing123 »).
# Un seul client : le réseau Docker wakatnet-dev, ce qui couvre le service
# radclient du profil "tools" et les paquets venant de l'hôte par
# 127.0.0.1:1812 (ils arrivent avec l'adresse de la passerelle du réseau).
#
# Le secret n'est pas dans ce fichier : il est lu dans l'environnement
# (infra/dev/.env, non versionné).
#
# La vraie configuration (clients dynamiques, SQL, detail…) est l'objet de
# la phase 1 et vivra dans infra/freeradius/.

client wakatnet_dev {
	ipaddr = $ENV{RADIUS_DEV_CLIENT_NET}
	proto = udp
	secret = $ENV{RADIUS_DEV_SECRET}
	nas_type = other
	shortname = wakatnet-dev

	# BlastRADIUS (CVE-2024-3596), SPEC §1.2 : valeurs explicites, pas « auto ».
	require_message_authenticator = yes
	limit_proxy_state = yes
}
