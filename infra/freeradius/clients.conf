# WAKATNET — clients RADIUS de PRODUCTION (ADR 0006 §16, SPEC §5.1).
# Un seul bloc couvre tout l'overlay WireGuard : aucun client statique.
# Chaque routeur est créé dynamiquement au premier paquet (serveur
# dynamic_clients), avec SON secret, puis gardé en cache pendant « lifetime ».
client overlay {
	ipaddr = 10.213.0.0/16
	dynamic_clients = dynamic_clients
	# 300 s en production ; réduit en test (radius/tests/surcharges/LISTE.md).
	lifetime = $ENV{WAKATNET_CLIENT_LIFETIME}
	# Un nouveau client par seconde au plus : protection contre le déni de service
	# (désactivé par défaut, donc écrit explicitement ; ADR 0006 §16).
	rate_limit = yes
	# BlastRADIUS (SPEC §1.2). Attention : pour un client DYNAMIQUE, c'est
	# FreeRADIUS-Client-Require-MA (posé par client_lookup) qui fait foi,
	# cette valeur étant écrasée (client.c l. 1594, E-FR-2).
	require_message_authenticator = yes
	limit_proxy_state = yes
}
