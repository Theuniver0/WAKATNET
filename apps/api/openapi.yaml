# WAKATNET — contrat HTTP de l'API, phase 2 (ADR 0012 §4 et §7). Vérifié par tests/openapi.test.ts.
openapi: 3.1.0
info:
  title: WAKATNET API
  version: 0.2.0
  description: >
    Cloisonnement, enrôlement, paiement, portail. Identité par session (cookie wk_session,
    HttpOnly, Secure, SameSite=Strict ; ADR 0014 §1) ; toute requête qui modifie porte
    l'en-tête X-Wakatnet-Requete: 1 (anti-CSRF).
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: wk_session
  parameters:
    jeton:
      name: jeton
      in: path
      required: true
      description: Jeton d'enrôlement, 32 octets en base64url (43 caractères), à usage unique, 30 minutes.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
  schemas:
    Erreur:
      type: object
      required: [erreur]
      properties: { erreur: { type: string } }
    Hotspot:
      type: object
      required: [serveur, profil, use_radius]
      properties:
        serveur: { type: string, maxLength: 64 }
        profil: { type: string, maxLength: 64 }
        use_radius: { oneOf: [{ type: boolean }, { enum: ["true", "false", "yes", "no"] }] }
        html_directory: { type: string, maxLength: 128 }
        radius_accounting: { oneOf: [{ type: boolean }, { enum: ["true", "false", "yes", "no"] }] }
        radius_interim_update: { type: string, maxLength: 16 }
    Inscription:
      type: object
      description: Produit sur le routeur par `:serialize to=json` (étape 1).
      required: [cle, identity, modele, version, listen_port, coa_port, coa_accept, hotspots]
      properties:
        cle: { type: string, pattern: "^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$" }
        identity: { type: string, maxLength: 255 }
        modele: { type: string, maxLength: 64 }
        version: { type: string, description: "≥ 7.15, par exemple « 7.15.3 (stable) »" }
        listen_port: { type: [integer, string] }
        coa_port: { type: [integer, string] }
        coa_accept: { oneOf: [{ type: boolean }, { enum: ["true", "false", "yes", "no"] }] }
        hotspots: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/Hotspot" } }
security:
  - session: []
paths:
  /v1/inscription:
    post:
      summary: "Inscription d'un propriétaire (accès ouvert) ; aucune session ; même réponse que l'adresse soit libre ou prise (ADR 0019, F9)"
      security: []
      # Le mot de passe se choisit à la confirmation (/v1/verification/confirmer, migration 0043) ; un « mot_de_passe » envoyé ici est ignoré.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nom, email], properties: { nom: { type: string }, email: { type: string } } } } } }
      responses:
        "202": { description: "Demande prise : lien de confirmation (compte neuf) ou avis (adresse déjà inscrite) envoyé par e-mail" }
        "403": { description: En-tête anti-CSRF manquant }
        "422": { description: Saisie invalide }
        "429": { description: "5 demandes par heure et 10 par jour, par source (inscriptions et renvois confondus ; ADR 0019, audit du 13/11/2026)" }
  /v1/verification/renvoyer:
    post:
      summary: "Renvoi du lien de confirmation sans session ; réponse toujours identique ; 5 par heure et 10 par jour, par source (ADR 0019)"
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses: { "202": { description: Demande prise }, "422": { description: Adresse invalide } }
  # ADR 0017 (revue M4) : vérification de l'adresse du propriétaire, exigée pour raccorder un routeur.
  /v1/verification/confirmer:
    post:
      summary: Lien de vérification suivi (jeton à usage unique, 24 h) ; la page demande un clic, un GET ne consomme rien
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [jeton], properties: { jeton: { type: string } } } } } }
      responses: { "200": { description: Adresse vérifiée }, "404": { description: Lien invalide ou expiré } }
  /v1/verification/envoyer:
    post:
      summary: Nouveau lien de vérification pour le propriétaire connecté (3 par heure)
      security: []
      responses: { "202": { description: Lien envoyé }, "401": { description: Connexion requise }, "403": { description: Réservé au propriétaire }, "429": { description: Déjà vérifiée, ou trop de liens }, "503": { description: Envoi d'e-mails pas encore en service } }
  /v1/connexion:
    post:
      summary: Connexion ; même réponse que le compte existe ou non
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, mot_de_passe] } } } }
      responses:
        "200": { description: Session ouverte (cookie) }
        "401": { description: Adresse ou mot de passe incorrect }
        "429": { description: Trop d'échecs (5 en 15 min) }
  /v1/deconnexion:
    post:
      summary: Ferme la session
      security: []
      responses: { "200": { description: Session fermée } }
  /v1/moi:
    get:
      summary: Utilisateur de la session
      security: []
      responses: { "200": { description: Rôle, propriétaire, point de vente, TOTP validé, adresse vérifiée }, "401": { description: Connexion requise } }
  /v1/totp:
    post:
      summary: Double authentification du super-admin (RFC 6238) ; un code ne sert qu'une fois
      security: []
      responses: { "200": { description: Session validée pour /admin }, "401": { description: Code invalide ou déjà utilisé } }
  # Phase 4 (ADR 0014) : exploitation commerciale. Rôles par route : P = propriétaire, G = gérant, V = vendeur.
  /v1/sites:
    get: { summary: Sites du propriétaire, responses: { "200": { description: Sites }, "401": { description: Connexion requise }, "403": { description: Rôle refusé } } }
    post: { summary: "Nouveau site (P)", responses: { "201": { description: Site créé }, "422": { description: Nom invalide } } }
  /v1/forfaits:
    get: { summary: "Forfaits (P, G, V)", responses: { "200": { description: Forfaits } } }
    post: { summary: "Nouveau forfait (P)", responses: { "201": { description: Forfait créé }, "422": { description: Saisie invalide } } }
  /v1/forfaits/{id}:
    put: { summary: "Modifie ou retire un forfait (P) ; les tickets existants gardent leur copie figée", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Forfait }, "404": { description: Inconnu }, "422": { description: Saisie invalide } } }
  /v1/points-de-vente:
    get: { summary: "Points de vente (P : tous ; G, V : le sien)", responses: { "200": { description: Liste } } }
    post: { summary: "Nouveau point de vente (P)", responses: { "201": { description: Créé }, "409": { description: Nom déjà pris } } }
  /v1/utilisateurs:
    get: { summary: "Utilisateurs du propriétaire (P)", responses: { "200": { description: Liste } } }
    post: { summary: "Nouveau gérant ou vendeur (P)", responses: { "201": { description: Créé }, "409": { description: Adresse déjà utilisée }, "422": { description: Saisie invalide } } }
  /v1/utilisateurs/{id}:
    put: { summary: "Retrait de l'accès d'un gérant ou d'un vendeur (P) : { actif: false } seulement ; sessions fermées ; audité", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Accès retiré }, "404": { description: Inconnu, ou pas un gérant ni un vendeur de ce propriétaire }, "422": { description: Corps refusé } } }
  /v1/lots:
    get: { summary: "Lots de tickets papier et leurs états (P : tous ; G, V : son point de vente)", responses: { "200": { description: Lots } } }
    post: { summary: "Nouveau lot (P, G) ; refusé au plafond du découvert (ADR 0002)", responses: { "201": { description: Lot créé }, "409": { description: Plafond du découvert atteint }, "422": { description: Saisie invalide } } }
  /v1/lots/{id}/tickets:
    get: { summary: "Codes et états d'un lot (P, G, V de son point de vente)", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Tickets }, "404": { description: Inconnu } } }
  /v1/lots/{id}/tickets.pdf:
    get: { summary: "Planche A4 imprimable, 10 tickets par page (P, G)", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: PDF, content: { application/pdf: {} } }, "404": { description: Inconnu } } }
  /v1/lots/{id}/remis:
    post: { summary: "Lot remis au point de vente (P, G, V), une fois", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Remis }, "404": { description: Inconnu ou déjà remis } } }
  /v1/stats/ventes-papier:
    get: { summary: "Statistiques par point de vente et par auteur (P ; G : son point de vente ; V : ses lots)", responses: { "200": { description: Statistiques } } }
  /v1/argent/synthese:
    get: { summary: "Ventes, commissions, frais, rechargements, solde de crédits (P) ; ?debut&fin=AAAA-MM-JJ", responses: { "200": { description: Synthèse }, "422": { description: Période invalide } } }
  /v1/argent/alerte:
    get: { summary: "Alerte « crédits bas » : solde sous 20 % du dernier rechargement (P ; SPEC §8.2, migration 0041)", responses: { "200": { description: "bas, solde_xof, dernier_rechargement_xof" } } }
  /v1/argent/releve.csv:
    get: { summary: "Relevé CSV (UTF-8 BOM, « ; ») ; numéro masqué seulement (P)", responses: { "200": { description: CSV, content: { text/csv: {} } }, "422": { description: Période invalide } } }
  /v1/argent/releve.pdf:
    get: { summary: "Relevé PDF (P)", responses: { "200": { description: PDF, content: { application/pdf: {} } }, "422": { description: Période invalide } } }
  /v1/argent/facture.pdf:
    get: { summary: "Facture mensuelle de commission, PROVISOIRE tant que les mentions fiscales manquent (P) ; ?mois=AAAA-MM", responses: { "200": { description: PDF, content: { application/pdf: {} } }, "422": { description: Mois invalide } } }
  /v1/paiements/recherche:
    post: { summary: "Paiements d'un numéro, par HMAC, forme masquée (P) ; journalisée", responses: { "200": { description: Paiements }, "422": { description: Numéro invalide } } }
  /admin/v1/proprietaires:
    get: { summary: "Propriétaires, solde, ventes et commission (super-admin, TOTP validé)", responses: { "200": { description: Liste }, "401": { description: Connexion requise }, "403": { description: Super-admin avec TOTP exigé } } }
  /admin/v1/proprietaires/{id}:
    put: { summary: "Suspension, commission, plafond (super-admin) ; audité", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Réglé }, "404": { description: Inconnu }, "422": { description: Saisie invalide } } }
  /admin/v1/proprietaires/{id}/acces:
    put: { summary: "Quota d'enrôlement et validation de l'adresse du propriétaire (super-admin, ADR 0017) ; audité", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Réglé }, "404": { description: Inconnu }, "422": { description: Saisie invalide } } }
  /admin/v1/proprietaires/{id}/recharges:
    post: { summary: "Rechargement des crédits, idempotent sur la référence (super-admin) ; audité", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "201": { description: Rechargé }, "404": { description: Inconnu }, "409": { description: Référence déjà utilisée pour un autre montant }, "422": { description: Saisie invalide } } }
  /v1/routers:
    get:
      summary: Routeurs du propriétaire
      responses:
        "200": { description: Routeurs, content: { application/json: { schema: { type: array } } } }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu }
  /v1/sites/{site}/enrollments:
    post:
      summary: Nouvelle commande d'enrôlement pour un site du propriétaire
      parameters:
        - { name: site, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Commande à coller dans le terminal RouterOS
          content:
            application/json:
              schema:
                type: object
                required: [commande, expire_le]
                properties: { commande: { type: string }, expire_le: { type: string, format: date-time } }
        "404": { description: Site inconnu ou d'un autre propriétaire }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu, ou adresse e-mail non vérifiée (ADR 0017) }
        "409": { description: "Quota de routeurs atteint (ADR 0017), ou plafond des comptes non validés (ADR 0019)" }
  /v1/imports/mikhmon:
    post:
      summary: Importe des tickets Mikhmon (CSV name, password, profile) ; rejouable sans doublon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv, correspondance]
              properties:
                csv: { type: string, description: "CSV avec en-tête ; 20 000 lignes au plus" }
                correspondance: { type: object, additionalProperties: { type: string }, description: "profil Mikhmon → identifiant de forfait" }
      responses:
        "200": { description: "Rapport : importes, doublons, refuses, courts, et une entrée par ligne", content: { application/json: { schema: { type: object } } } }
        "422": { description: CSV ou correspondance invalide ; rien n'est importé }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu }
  # Migration 0050 : réémission des tickets importés jamais utilisés (codes de la plateforme, en lots imprimables).
  /v1/imports/reemission:
    get:
      summary: Tickets importés réémissibles, par forfait (tickets, dont codes courts)
      responses:
        "200": { description: "forfaits : [{ forfait_id, forfait, tickets, courts }]", content: { application/json: { schema: { type: object } } } }
        "401": { description: Identité absente ou invalide }
        "403": { description: Réservé au propriétaire }
    post:
      summary: Remplace les tickets importés jamais utilisés par des codes de la plateforme ; les anciens codes ne valent plus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point_de_vente_id]
              properties: { point_de_vente_id: { type: string }, forfait_id: { type: string, description: "un seul forfait ; absent : tous" } }
      responses:
        "201": { description: "Lots créés : { tickets, lots: [{ id, forfait_id, quantite }] }", content: { application/json: { schema: { type: object } } } }
        "409": { description: Aucun ticket importé à réémettre }
        "422": { description: Point de vente ou forfait invalide }
        "401": { description: Identité absente ou invalide }
        "403": { description: Réservé au propriétaire }
  /v1/sites/{site}/redirection.html:
    get:
      summary: Page « login.html » du hotspot, qui renvoie le client vers le portail de ce site
      parameters:
        - { name: site, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Page HTML à installer sur le routeur, content: { text/html: {} } }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu }
        "404": { description: Site inconnu ou d'un autre propriétaire }
  /v1/routers/{id}/revoke:
    post:
      summary: Révoque un routeur du propriétaire (tunnel retiré, plus reconnu par RADIUS) ; idempotent, définitif
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Routeur révoqué, content: { application/json: { schema: { type: object } } } }
        "404": { description: Routeur inconnu ou d'un autre propriétaire }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu }
  /v1/routers/{id}/entretien:
    post: { summary: "Nouveau jeton d'entretien (ADR 0023) : rend la ligne du planificateur à coller ; l'ancien cesse de valoir (P)", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Ligne RouterOS }, "404": { description: Routeur inconnu, révoqué ou déclaré à la main } } }
  /v1/routers/{id}/uninstall.rsc:
    get:
      summary: Script de désinstallation propre au routeur (valeurs d'origine relevées)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Script RouterOS, content: { text/plain: {} } }
        "404": { description: Routeur inconnu ou d'un autre propriétaire }
        "409": { description: Routeur déclaré à la main, sans inventaire }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu }
  /v1/compte-marchand:
    put:
      summary: Enregistre ou remplace les clés du compte marchand (mode A) ; elles ne sont jamais rendues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fournisseur, cles]
              properties:
                fournisseur: { type: string, description: "« mock » tant que le vrai adaptateur attend ses clés (ticket 08)" }
                cles: { type: object }
      responses:
        "200": { description: "URL du webhook à déclarer chez le fournisseur", content: { application/json: { schema: { type: object, properties: { fournisseur: { type: string }, url_webhook: { type: string } } } } } }
        "401": { description: Identité absente ou invalide }
        "403": { description: Propriétaire suspendu }
        "409": { description: Changement de fournisseur impossible tant que des paiements sont ouverts }
        "422": { description: Fournisseur inconnu ou clés invalides }
        "503": { description: Clés de chiffrement absentes de la configuration }
  /webhooks/{fournisseur}/{webhook}:
    post:
      summary: Webhook d'un fournisseur ; signé, corps brut conservé ; déclenche verify(), qui fait foi
      security: []
      parameters:
        - { name: fournisseur, in: path, required: true, schema: { type: string } }
        - { name: webhook, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{24}$" } }
      requestBody: { required: true, content: { "*/*": {} } }
      responses:
        "200": { description: Événement enregistré (doublon sans effet) }
        "400": { description: Événement invalide (identifiant ou référence hors forme) ; aucun effet }
        "503": { description: Paiement non configuré }
        "401": { description: Signature invalide ; aucun effet }
        "404": { description: Compte marchand inconnu }
  # Portail captif : pages HTML publiques, rendues côté serveur (ADR 0013 §10 ; SPEC §7.1, §7.2).
  /p/{site}:
    get: { summary: Accueil du portail, security: [], responses: { "200": { description: Page HTML }, "404": { description: Site inconnu } } }
  /p/{site}/ticket:
    post: { summary: Connexion avec un ticket (redirection vers le hotspot), security: [], responses: { "303": { description: Redirection }, "200": { description: Code affiché } } }
  /p/{site}/forfaits:
    get: { summary: Forfaits en vente, security: [], responses: { "200": { description: Page HTML }, "404": { description: Site inconnu } } }
  /p/{site}/payer:
    get: { summary: Formulaire de paiement, security: [], responses: { "200": { description: Page HTML } } }
    post: { summary: Création du paiement (idempotente sur la soumission, P9 ; limitée par numéro, appareil et site), security: [], responses: { "303": { description: Vers le suivi de l'achat }, "409": { description: Vente en ligne indisponible }, "422": { description: Saisie invalide }, "429": { description: Trop de demandes }, "503": { description: Paiement non configuré } } }
  /p/{site}/achat/{ref}:
    get: { summary: Suivi d'un achat, puis ticket et auto-connexion, security: [], responses: { "200": { description: Page HTML }, "404": { description: Inconnu } } }
  /p/{site}/etat/{ref}:
    get: { summary: État d'un achat en JSON (jamais le code), security: [], responses: { "200": { description: Statut }, "404": { description: Inconnu } } }
  /p/{site}/retrouver:
    get: { summary: Formulaire de récupération, security: [], responses: { "200": { description: Page HTML } } }
    post: { summary: Récupération par numéro et référence (tentatives limitées), security: [], responses: { "303": { description: Trouvé }, "404": { description: Introuvable }, "429": { description: Trop de tentatives } } }
  /entretien/{jeton}:
    parameters:
      - $ref: "#/components/parameters/jeton"
    get:
      summary: "Étape 3, entretien (SPEC §6.2, ADR 0023) : script des objets wakatnet, tiré par le planificateur du routeur"
      security: []
      responses:
        "200": { description: Script RouterOS, content: { text/plain: {} } }
        "404": { description: Jeton inconnu ou routeur révoqué (réponse identique) }
  /enroll/{jeton}:
    parameters:
      - $ref: "#/components/parameters/jeton"
    get:
      summary: Étape 1 (script RouterOS) ; ne consomme pas le jeton
      security: []
      responses:
        "200": { description: Script RouterOS, content: { text/plain: {} } }
        "404": { description: Jeton inconnu, expiré ou consommé (réponse identique) }
    post:
      summary: Étape 2 ; consomme le jeton, crée le routeur, rend sa configuration
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Inscription" } } }
      responses:
        "200": { description: Script RouterOS de l'étape 2 (contient le secret RADIUS), content: { text/plain: {} } }
        "404": { description: Jeton inconnu, expiré ou consommé }
        "409": { description: Clé WireGuard déjà enrôlée ; jeton intact }
        "422": { description: Inscription invalide ; jeton intact }
        "503": { description: Aucun nœud configuré ou overlay plein ; jeton intact }
